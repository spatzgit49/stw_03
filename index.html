<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find all prime numbers within a number range."
    />
    <title>Prime Number Finder</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card" aria-labelledby="page-title">
        <p class="eyebrow">NUMBER TOOL</p>
        <h1 id="page-title">Prime Number Finder</h1>
        <p class="intro">Enter a range to find every prime number between the two values.</p>

        <form id="prime-form" novalidate>
          <div class="input-grid">
            <label>
              Initial number
              <input id="start" name="start" type="number" min="0" step="1" placeholder="e.g. 2" required autofocus />
            </label>
            <label>
              Final number
              <input id="end" name="end" type="number" min="0" step="1" placeholder="e.g. 100" required />
            </label>
          </div>
          <button type="submit">Find prime numbers</button>
        </form>

        <p id="message" class="message" role="alert" aria-live="polite"></p>
        <section id="results" class="results" aria-live="polite" aria-labelledby="result-title" hidden>
          <h2 id="result-title"></h2>
          <div id="prime-list" class="prime-list"></div>
        </section>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
